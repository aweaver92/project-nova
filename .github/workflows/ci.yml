name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nova-sim:
    name: nova-sim harness (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Self-test
        run: npm test

  ios:
    name: Nova iOS (build + test on Simulator)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Nova
    steps:
      - uses: actions/checkout@v4

      # Use the newest stable Xcode so it can read the project format emitted by
      # the latest XcodeGen (an older Xcode fails with "Unable to read project").
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # Compile every module for iOS via SwiftPM. This is the check that could
      # never run on Windows: it validates the Swift ports (GA Realtime provider,
      # HFP audio, DAT adapters, token services) actually build for the device.
      - name: Build Swift package (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme Nova-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run package tests (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Nova-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # Generate the real iOS app project from the checked-in XcodeGen spec and
      # build it unsigned. Proves the NovaApp target (SwiftUI entry + DI) compiles.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app project
        run: xcodegen generate

      - name: Build NovaApp (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project NovaApp.xcodeproj \
            -scheme NovaApp \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
