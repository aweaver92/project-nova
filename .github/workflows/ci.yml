name: CI

# Budget notes (private-repo macOS bills at 10x, so 2,000 free min ≈ ~200 macOS
# min/month). To keep macOS minutes low:
#   * concurrency cancels superseded runs on the same ref
#   * a cheap Linux "changes" job gates the macOS jobs to iOS-only edits
#   * the macOS test job runs on PRs only (not on every push to main)
#   * the .ipa job does ONE compile (device build) instead of four
on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore: ["**/*.md", "Docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "Docs/**"]
  workflow_dispatch:

# A rapid series of pushes to the same branch cancels the older, still-running
# jobs instead of paying for all of them. Never cancel a manual .ipa dispatch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Detect changed areas (Linux)
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'Nova/**'
            bridge:
              - 'nova-bridge/**'
              - 'nova-sim/**'

  nova-bridge:
    name: nova-bridge (Linux)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  nova-sim:
    name: nova-sim harness (Linux)
    needs: changes
    # Free Linux minutes — run whenever the bridge/sim changed, or on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Self-test
        run: npm test

  ios-test:
    name: Nova iOS (build + test on Simulator)
    needs: changes
    # The expensive one. Only run when iOS code changed AND we're on a PR — a
    # merge to main is already covered by the PR that produced it, so we don't
    # pay a second time on push. (Direct pushes to main skip this; open a PR to
    # get Swift CI, or trust the .ipa dispatch to catch breaks.)
    if: >-
      needs.changes.outputs.ios == 'true' &&
      github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Nova
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # `test` compiles every module and runs the suite in a single pass, so we
      # no longer need separate "build package" / "build app" compile steps.
      - name: Build + test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Nova-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ios-ipa:
    name: Nova iOS (unsigned .ipa)
    # AltStore installable build. Runs on every push to main (the repo is public,
    # so macOS minutes are free) plus manual dispatch and version tags. No OpenAI
    # key is baked in anymore — the app mints Realtime secrets from the Nova
    # Bridge at runtime, so the artifact carries no secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Nova
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      # Gate the IPA on a green test suite so auto-builds from push never ship a
      # broken app.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build + test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Nova-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app project
        run: xcodegen generate

      # Build the real device app unsigned; AltStore re-signs at install time.
      - name: Build unsigned device app (arm64)
        run: |
          xcodebuild build \
            -project NovaApp.xcodeproj \
            -scheme NovaApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/NovaApp.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App not found at $APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload NovaApp.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NovaApp.ipa Payload
          ls -lh NovaApp.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaApp-unsigned-ipa
          path: Nova/NovaApp.ipa
          if-no-files-found: error
          retention-days: 14
