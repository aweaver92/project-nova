name: CI

# Linux jobs are always free. The macOS .ipa job is manual/tags only so it
# never burns minutes on ordinary pushes (and stays free on a public repo).
on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore: ["**/*.md", "Docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "Docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Detect changed areas (Linux)
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bridge:
              - 'nova-bridge/**'
              - 'nova-sim/**'

  nova-bridge:
    name: nova-bridge (Linux)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  nova-sim:
    name: nova-sim harness (Linux)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Self-test
        run: npm test

  ios-ipa:
    name: Nova iOS (unsigned .ipa)
    # SideStore-installable build. Manual dispatch or a version tag only — never
    # on ordinary pushes. Public repo = free macOS minutes; private = 10x bill.
    # Optional OPENAI_API_KEY repo secret is baked into Info.plist for Voice V2
    # (direct Realtime). Without it, Voice V2 shows a missing-key error; the
    # main Assistant tab can still mint via nova-bridge.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Nova
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Bake OpenAI API key for Voice V2 (optional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            # Trim whitespace/newlines; quote so xcconfig does not treat // as a comment.
            KEY=$(printf '%s' "$OPENAI_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # Escape double quotes inside the key (rare).
            KEY_ESCAPED=${KEY//\"/\\\"}
            printf 'OPENAI_API_KEY = "%s"\n' "$KEY_ESCAPED" > Config/Secrets.xcconfig
            echo "Wrote Config/Secrets.xcconfig (key length ${#KEY})"
          else
            echo "No OPENAI_API_KEY secret — Voice V2 will require a key; Assistant can still use the bridge."
          fi
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build + test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Nova-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Stamp build identity into the app version
        run: |
          SHORT=$(git rev-parse --short HEAD)
          STAMP=$(date -u +%m%d-%H%M)
          BUILD="${SHORT}-${STAMP}"
          echo "Stamping CURRENT_PROJECT_VERSION=$BUILD"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${BUILD}\"/" project.yml
          cat > Sources/NovaCore/NovaBuildStamp.swift <<EOF
          import Foundation

          /// Build identity baked into the binary at IPA compile time.
          /// AltStore/SideStore often rewrite \`CFBundleVersion\` to \`1.0 (1)\`, so the
          /// Listen banner and Settings must prefer this constant over the Info.plist.
          public enum NovaBuildStamp {
              public static let id = "${BUILD}"
          }
          EOF
          echo "NOVA_BUILD_STAMP=${BUILD}" >> "$GITHUB_ENV"
          grep -n 'static let id' Sources/NovaCore/NovaBuildStamp.swift
      - name: Generate app project
        run: xcodegen generate

      - name: Build unsigned device app (arm64)
        run: |
          xcodebuild build \
            -project NovaApp.xcodeproj \
            -scheme NovaApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa into App/
        run: |
          APP="build/Build/Products/Release-iphoneos/NovaApp.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App not found at $APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true
          mkdir -p App
          rm -rf Payload App/NovaApp.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry App/NovaApp.ipa Payload
          ls -lh App/NovaApp.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaApp-unsigned-ipa
          path: Nova/App/NovaApp.ipa
          if-no-files-found: error
          retention-days: 14
