# XcodeGen spec — generates NovaApp.xcodeproj on any Mac (incl. CI) from this
# checked-in definition, so the iOS app target can be authored entirely on
# Windows. Run `xcodegen generate` in this folder (Nova/) to produce the project.
name: NovaApp

options:
  bundleIdPrefix: ai.nova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Nova:
    path: .
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.8.0

targets:
  NovaApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Nova
        product: NovaComposition
      - package: Nova
        product: NovaData
      - package: Nova
        product: NovaCore
      # App target links MWDATCore directly so it can call Wearables.configure().
      - package: MetaWearablesDAT
        product: MWDATCore
      # Embeds the widget extension that renders the Live Activities.
      - target: NovaWidgetsExtension
    # Generated by XcodeGen from the properties below (see .gitignore).
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        # Enables Live Activities (Max rest timer, Remy cook mode) on the lock
        # screen and Dynamic Island.
        NSSupportsLiveActivities: true
        # Expose Documents/ (where voice recordings are saved) in the Files app so
        # users can play, share, and manage their recordings on the iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: "Nova streams your voice to the AI assistant and saves voice recordings you start."
        NSSpeechRecognitionUsageDescription: "Nova listens on-device for the wake word 'Nova' so it only streams to the cloud when you address it."
        NSCameraUsageDescription: "Nova uses your glasses camera to answer questions about what you see."
        NSRemindersFullAccessUsageDescription: "Nova creates and reads reminders when you ask it to."
        NSCalendarsFullAccessUsageDescription: "Nova reads and creates calendar events when you ask it to."
        NSBluetoothAlwaysUsageDescription: "Nova connects to your Meta glasses over Bluetooth for audio and camera."
        # Reach the Nova Bridge (Claude Code / Cursor) running on the user's dev
        # machine over the local network by LAN IP. iOS prompts for local-network
        # access on first connect, and ATS must allow plaintext HTTP to LAN hosts.
        # This exception is scoped to local networking only — it does NOT relax
        # ATS for arbitrary internet hosts.
        NSLocalNetworkUsageDescription: "Nova connects to the Nova Bridge running on your computer over your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Meta DAT discovers/link-leases the glasses over the local network via
        # Bonjour; required alongside NSLocalNetworkUsageDescription for the
        # glasses to be found during registration.
        NSBonjourServices:
          - _bonjour._tcp
          - _nova-bridge._tcp
        # Meta Wearables DAT: external-accessory link + background access.
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        UIBackgroundModes:
          # `audio` keeps the mic/HFP session alive when the phone is locked or
          # pocketed, so wake-word listening continues hands-free.
          - audio
          - bluetooth-central
          # Meta DAT expects `bluetooth-peripheral` + `external-accessory` for the
          # glasses link/link-lease to survive backgrounding.
          - bluetooth-peripheral
          - external-accessory
        # Lets the SDK detect and open the Meta AI companion app.
        LSApplicationQueriesSchemes:
          - fb-viewapp
          - spotify
          - music
        # URL scheme Meta AI uses to call back after registration/permissions.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - nova
        # Developer Mode config: per Meta's DAT docs, a Developer-Mode app needs
        # ONLY AppLinkURLScheme + MetaAppID "0". Adding a (placeholder) ClientToken
        # and TeamID makes the SDK see "all attestation keys present" and take the
        # PRODUCTION registration path — which needs a real registered app + a
        # universal link we don't have, yielding Meta AI's generic "Internal Error".
        # For a signed/production build, add real ClientToken (Wearables Developer
        # Center) + TeamID (your Apple Team ID) and set a real MetaAppID.
        MWDAT:
          AppLinkURLScheme: "nova://"
          # "0" enables Developer Mode registration; replace with your Meta App ID for release.
          MetaAppID: "0"
        # Standard OpenAI key for the direct ephemeral-secret path. Empty unless
        # you provide Config/Secrets.xcconfig (git-ignored). See Config/Nova.xcconfig.
        OpenAIAPIKey: "$(OPENAI_API_KEY)"
    # App Group shared with the widget extension (required so the app + widget
    # can coordinate; also carries the Live Activities capability).
    entitlements:
      path: App/Nova.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.nova.app
    # Base build settings + optional git-ignored Secrets.xcconfig include.
    configFiles:
      Debug: Config/Nova.xcconfig
      Release: Config/Nova.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nova.app
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        # App icon lives in App/Assets.xcassets/AppIcon.appiconset (1024x1024, opaque).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # WidgetKit extension hosting the Live Activities. Renders the shared
  # ActivityAttributes from the NovaLiveActivity package.
  NovaWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: Nova
        product: NovaLiveActivity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nova
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/NovaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.nova.app
    configFiles:
      Debug: Config/Nova.xcconfig
      Release: Config/Nova.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nova.app.widgets
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        # Widget extensions must be marked as app extensions for embedding.
        APPLICATION_EXTENSION_API_ONLY: YES
