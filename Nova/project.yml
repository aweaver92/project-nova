# XcodeGen spec — generates NovaApp.xcodeproj on any Mac (incl. CI) from this
# checked-in definition, so the iOS app target can be authored entirely on
# Windows. Run `xcodegen generate` in this folder (Nova/) to produce the project.
name: NovaApp

options:
  bundleIdPrefix: ai.nova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Nova:
    path: .
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.8.0

targets:
  NovaApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Nova
        product: NovaComposition
      # App target links MWDATCore directly so it can call Wearables.configure().
      - package: MetaWearablesDAT
        product: MWDATCore
    # Generated by XcodeGen from the properties below (see .gitignore).
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Nova streams your voice to the AI assistant."
        NSCameraUsageDescription: "Nova uses your glasses camera to answer questions about what you see."
        NSBluetoothAlwaysUsageDescription: "Nova connects to your Meta glasses over Bluetooth for audio and camera."
        # Meta Wearables DAT: external-accessory link + background access.
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        UIBackgroundModes:
          - bluetooth-central
          - external-accessory
        # Lets the SDK detect and open the Meta AI companion app.
        LSApplicationQueriesSchemes:
          - fb-viewapp
        # URL scheme Meta AI uses to call back after registration/permissions.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - nova
        # DAT requires all four keys present. In Developer Mode (MetaAppID "0")
        # ClientToken/TeamID are not validated by Meta, but the SDK still expects
        # them non-empty. Replace all three with real values from the Wearables
        # Developer Center + your Apple Team ID for a signed/production build.
        MWDAT:
          AppLinkURLScheme: "nova://"
          # "0" enables Developer Mode registration; replace with your Meta App ID for release.
          MetaAppID: "0"
          ClientToken: "developer-mode-placeholder"
          TeamID: "developer-mode-placeholder"
        # Standard OpenAI key for the direct ephemeral-secret path. Empty unless
        # you provide Config/Secrets.xcconfig (git-ignored). See Config/Nova.xcconfig.
        OpenAIAPIKey: "$(OPENAI_API_KEY)"
    # Base build settings + optional git-ignored Secrets.xcconfig include.
    configFiles:
      Debug: Config/Nova.xcconfig
      Release: Config/Nova.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nova.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
